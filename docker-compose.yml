version: "3.8"

services:
  codekit:
    build: .
    ports:
      - "8000:8000"
      - "4000:4000"
    environment:
      - CODEKIT_REPLICA_COUNT=1
      - CODEKIT_MIGRATIONS_DIR=/opt/dagster/migrations
    volumes:
      - ./examples/docker-compose/config.sqlite.yaml:/etc/codekit/config.yaml:ro
      - codekit-data:/opt/dagster/codekit_data
    profiles:
      - sqlite

  codekit-postgres:
    build: .
    ports:
      - "8000:8000"
      - "4000:4000"
    environment:
      - DAGSTER_POSTGRES_USER=codekit
      - DAGSTER_POSTGRES_PASSWORD=codekit
      - DAGSTER_POSTGRES_DB=codekit
      - DAGSTER_POSTGRES_HOSTNAME=postgres
      - CODEKIT_MIGRATIONS_DIR=/opt/dagster/migrations
    volumes:
      - ./examples/docker-compose/config.postgres.yaml:/etc/codekit/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codekit
      POSTGRES_PASSWORD: codekit
      POSTGRES_DB: codekit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codekit"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - postgres

volumes:
  codekit-data:
  postgres-data:
