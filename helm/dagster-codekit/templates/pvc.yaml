{{- if and .Values.persistence.enabled (hasPrefix "sqlite" .Values.codekit.database.url) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dagster-codekit.fullname" . }}-data
  labels:
    {{- include "dagster-codekit.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
