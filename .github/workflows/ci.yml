name: CI

on:
  workflow_call:

  pull_request:
    branches: [main, develop, 'release/*']

  push:
    branches: [main, develop, 'release/*']

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e '.[dev]'

      - name: Run linter (ruff)
        run: uv run ruff check .

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=dagster_codekit \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 7

  e2e-kubernetes:
    name: E2E Kubernetes (kind)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: codekit-e2e

      - name: Build Docker image
        run: docker build -t dagster-codekit:latest .

      - name: Load image into kind
        run: kind load docker-image dagster-codekit:latest --name codekit-e2e

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install test deps
        run: uv pip install --system -e ".[dev,kubernetes]"

      - name: Deploy codekit to kind
        run: |
          kubectl create namespace dagster --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f examples/kubernetes/manifests.yaml -n dagster

      - name: Wait for codekit
        run: |
          kubectl wait --for=condition=available deployment/codekit -n dagster --timeout=120s || (
            echo "=== Deployment status ==="
            kubectl describe deployment codekit -n dagster
            echo "=== Pod logs ==="
            kubectl logs -n dagster -l app.kubernetes.io/name=dagster-codekit --tail=50 || true
            exit 1
          )

      - name: Port forward and run e2e
        run: |
          kubectl port-forward -n dagster svc/codekit 4000:4000 &
          sleep 5
          uv run pytest tests/e2e/test_k8s_launcher.py -v --tb=short

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl logs -n dagster deployment/codekit --tail=100 || true
          kubectl get jobs -n dagster -o yaml || true
