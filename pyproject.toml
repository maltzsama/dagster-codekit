# PROJECT METADATA
[project]
name = "dagster-codekit"
version = "0.1.0"
description = "Bridge between CI/CD and Dagster OSS - Auto-reload code locations on deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Demetrius Albuquerque", email = "demetrius.albuquerque@yahoo.com.br"}
]

keywords = [
    "dagster",
    "data-orchestration",
    "ci-cd",
    "gitops",
    "argocd",
    "kubernetes",
    "automation",
    "devops",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

# DEPENDENCIES
dependencies = [
    "dagster>=1.10.0",
    "fastapi>=0.115.0,<0.116.0",
    "starlette>=0.37.2,<0.39.0",
    "uvicorn[standard]>=0.40.0",
    "peewee>=3.19.0",
    "click>=8.3.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.19.1",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
    "grpcio>=1.78.0",
    "grpcio-health-checking>=1.78.0",
]

# OPTIONAL DEPENDENCIES (Extras)
[project.optional-dependencies]
kubernetes = [
    "kubernetes>=35.0.0",
]

postgres = [
    "psycopg2-binary>=2.9.0",   # Added for Production Database
]

# CLI ENTRYPOINT
[project.scripts]
dagster-codekit = "dagster_codekit.cli:cli"

# BUILD CONFIG
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_codekit"]


# DEVELOPMENT CONFIGURATION

# UV DEPENDENCY GROUPS (Novo Padrão)
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=26.1.0",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.4",
]

# PYTEST CONFIG
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v --cov=dagster_codekit --cov-report=term-missing"
pythonpath = ["."]

# MYPY CONFIG
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# RUFF LINTER CONFIG
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

# BLACK FORMATTER CONFIG
[tool.black]
line-length = 100
target-version = ['py310']

# COVERAGE CONFIG
[tool.coverage.run]
source = ["dagster_codekit"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
